name: Private visual checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci --no-fund --no-audit
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run sample
      - run: node scripts/generate-icons.mjs
      - run: npm run notices
      - run: git diff --exit-code -- samples assets src/notices.ts THIRD-PARTY-NOTICES.txt
      - run: npm run audit:dependencies
      - run: npm run audit:certification
      - run: npm run browser:install
      - run: npm run test:browser
      - run: npm run audit:package
      - uses: actions/upload-artifact@v4
        with:
          name: atlyn-process-lens-private-review
          path: |
            dist/*.pbiviz
            dist/SHA256SUMS.txt
            dist/package-audit.json
            dist/THIRD-PARTY-NOTICES.txt
          if-no-files-found: error
          retention-days: 30
